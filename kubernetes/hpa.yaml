apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventario-web-hpa
  namespace: inventario
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventario-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
