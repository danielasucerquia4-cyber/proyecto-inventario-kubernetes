apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventario-ingress
  namespace: inventario
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
    - host: inventario.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inventario-web
                port:
                  number: 80
